name: Actualizar partidos y publicar Mis Ligas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  schedule:
    # UTC. Avoid the start of the hour, when scheduled runs are more congested.
    - cron: '17,47 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mis-ligas-pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_enabled: ${{ steps.pages-status.outputs.enabled }}
    env:
      LIGAS_DATA_DIR: ${{ runner.temp }}/mis-ligas-db
      LIGAS_AUTO_UPDATE: '0'
    steps:
      - name: Descargar la versión guardada
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar la aplicación
        run: python -m pip install -r requirements.txt
      - name: Actualizar ambas fuentes y generar solo los archivos públicos
        run: python scripts/publish_snapshot.py --refresh --output-dir site
      - name: Conservar los resultados para la siguiente ejecución
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/current.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar resultados deportivos [skip ci]'
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
      - name: Comprobar que Pages esté activado
        id: pages-status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/tmp/pages-check-error; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Falta activar Pages o autorizar su acceso. Los datos y el artefacto se han preparado; no se publicó una URL.'
            echo "Activa **Settings → Pages → GitHub Actions** en https://github.com/${GITHUB_REPOSITORY}/settings/pages y vuelve a ejecutar este trabajo." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preparar GitHub Pages
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Subir únicamente el sitio generado
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1

  publicar:
    needs: actualizar
    if: needs.actualizar.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar la versión comprobada
        id: deployment
        uses: actions/deploy-pages@v4
